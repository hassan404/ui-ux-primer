name: Deploy course to GitHub Pages

on:
  push:
    branches: [claude/uiux-fundamentals-course-y99dse]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: course/package-lock.json
      - run: npm ci
        working-directory: course
      - run: npm run build
        working-directory: course
        env:
          DEPLOY_BASE: /ui-ux-primer
      - uses: actions/upload-pages-artifact@v3
        with:
          path: course/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
